<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8 bg-white p-10 rounded-2xl shadow-xl border-t-8 border-blue-700">
    <div class="text-center">
      <h2 class="text-3xl font-extrabold text-gray-900">Espace Citoyen</h2>
      <p class="mt-2 text-sm text-gray-500">Heureux de vous revoir</p>
    </div>

    <form class="mt-8 space-y-6" [formGroup]="loginForm" (ngSubmit)="onLogin()">
      <div class="space-y-4">
        <div>
          <label class="sr-only">Email</label>
          <input formControlName="email" type="email" required class="appearance-none rounded-lg relative block w-full px-3 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm" placeholder="Adresse Email">
        </div>
        <div class="space-y-1">
          <div class="relative group">
            <input
              [type]="showPassword ? 'text' : 'password'"
              formControlName="motDePasse"
              required
              class="appearance-none rounded-lg relative block w-full px-3 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm pr-12"
              placeholder="Mot de passe">

            <button
              type="button"
              (click)="togglePassword()"
              class="absolute inset-y-0 right-0 flex items-center px-3 text-gray-400 hover:text-blue-600 transition-colors"
            >
              <i [class]="showPassword ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye'"></i>
            </button>
          </div>
        </div>
      </div>

      <div class="flex items-center justify-between">
        <div class="flex items-center text-sm">
          <input type="checkbox" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
          <label class="ml-2 block text-gray-900">Se souvenir de moi</label>
        </div>
      </div>

      <button type="submit" [disabled]="loginForm.invalid" class="w-full py-3 px-4 border border-transparent text-sm font-bold rounded-lg text-white bg-blue-700 hover:bg-blue-800 focus:outline-none transition-all disabled:opacity-50">
        Se connecter
      </button>
    </form>

    <p class="text-center text-sm text-gray-600">
      Nouveau ici ? <a routerLink="/register" class="text-blue-600 font-bold hover:underline">Créer un compte</a>
    </p>
  </div>
</div>
