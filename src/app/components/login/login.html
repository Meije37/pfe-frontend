<div class="min-h-screen flex flex-col bg-[#f5f7f6]">
  <div class="national-stripe"></div>
  <header class="bg-white border-b border-gray-200">
    <div class="max-w-6xl mx-auto flex items-center gap-3 px-6 py-3">
      <img src="logo_symbole.png" alt="Logo Chikayti" class="w-11 h-11 object-contain flex-shrink-0">
      <div class="leading-tight">
        <p class="text-base font-bold text-gray-900">Chikayti</p>
        <p class="font-arabic text-xs text-gray-500">شكايتي · Plateforme des réclamations citoyennes</p>
      </div>
    </div>
  </header>

  <main class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md bg-white rounded-2xl border border-gray-200 shadow-sm p-8">
      <p class="text-xs font-semibold uppercase tracking-widest text-brand-700">Espace professionnel</p>
      <h1 class="mt-1 text-2xl font-bold text-gray-900">Connexion</h1>
      <p class="mt-1 text-sm text-gray-600">Accédez à la gestion et au traitement des réclamations.</p>

      <div *ngIf="erreur" role="alert"
           class="mt-6 flex items-start gap-3 rounded-lg border border-red-200 bg-red-50 px-3 py-3 text-sm text-red-800">
        <i class="fa-solid fa-circle-exclamation mt-0.5" aria-hidden="true"></i>
        <span>{{ erreur }}</span>
      </div>

      <form class="mt-6 space-y-5" [formGroup]="loginForm" (ngSubmit)="onLogin()" novalidate>
        <div>
          <label for="email" class="block text-sm font-semibold text-gray-700 mb-1.5">Adresse e-mail</label>
          <div class="relative">
            <i class="fa-regular fa-envelope absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400" aria-hidden="true"></i>
            <input id="email" formControlName="email" type="email" autocomplete="email" required
                   placeholder="nom@exemple.mr"
                   class="block w-full h-12 pl-10 pr-3 rounded-xl border border-gray-300 bg-white text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-4 focus:ring-brand-100 focus:border-brand-700">
          </div>
        </div>

        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label for="motDePasse" class="block text-sm font-semibold text-gray-700">Mot de passe</label>
            <a routerLink="/mot-de-passe-oublie" class="text-sm font-semibold text-brand-700 hover:underline">Mot de passe oublié ?</a>
          </div>
          <div class="relative">
            <i class="fa-solid fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400" aria-hidden="true"></i>
            <input id="motDePasse"
                   [type]="showPassword ? 'text' : 'password'"
                   formControlName="motDePasse"
                   autocomplete="current-password"
                   required
                   class="block w-full h-12 pl-10 pr-12 rounded-xl border border-gray-300 bg-white text-gray-900 focus:outline-none focus:ring-4 focus:ring-brand-100 focus:border-brand-700">
            <button type="button" (click)="togglePassword()"
                    [attr.aria-label]="showPassword ? 'Masquer le mot de passe' : 'Afficher le mot de passe'"
                    class="absolute inset-y-0 right-0 w-12 flex items-center justify-center text-gray-500 hover:text-brand-700 transition-colors cursor-pointer">
              <i [class]="showPassword ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye'" aria-hidden="true"></i>
            </button>
          </div>
        </div>

        <button type="submit" [disabled]="loginForm.invalid || chargement"
                class="w-full h-12 rounded-xl text-sm font-semibold text-white bg-brand-700 hover:bg-brand-800 transition-colors disabled:bg-gray-200 disabled:text-gray-500 cursor-pointer disabled:cursor-not-allowed">
          <span *ngIf="!chargement">Se connecter</span>
          <span *ngIf="chargement"><i class="fa-solid fa-spinner fa-spin mr-2" aria-hidden="true"></i>Connexion…</span>
        </button>
      </form>
    </div>
  </main>

  <footer class="border-t border-gray-200 bg-white">
    <div class="max-w-6xl mx-auto flex items-center gap-2 px-6 py-4 text-xs text-gray-500">
      <i class="fa-solid fa-shield-halved" aria-hidden="true"></i>
      Espace réservé aux agents et administrateurs. Les citoyens utilisent l'application mobile Chikayti.
    </div>
  </footer>
</div>
