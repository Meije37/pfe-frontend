<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-6 bg-white p-10 rounded-2xl shadow-xl border-t-8 border-blue-700">

    <!-- Indicateur d'étapes -->
    <div class="flex items-center justify-center gap-2 mb-2">
      <div [class]="etape === 'email' ? 'w-8 h-1.5 rounded-full bg-blue-700' : 'w-8 h-1.5 rounded-full bg-blue-200'"></div>
      <div [class]="etape === 'code' ? 'w-8 h-1.5 rounded-full bg-blue-700' : 'w-8 h-1.5 rounded-full bg-blue-200'"></div>
      <div [class]="etape === 'nouveauMotDePasse' ? 'w-8 h-1.5 rounded-full bg-blue-700' : 'w-8 h-1.5 rounded-full bg-blue-200'"></div>
    </div>

    <!-- ============ ÉTAPE 1 : EMAIL ============ -->
    <ng-container *ngIf="etape === 'email'">
      <div class="text-center">
        <i class="fa-solid fa-key text-3xl text-blue-700 mb-3 block"></i>
        <h2 class="text-2xl font-extrabold text-gray-900">Mot de passe oublié</h2>
        <p class="mt-2 text-sm text-gray-500">
          Entrez votre adresse email, nous vous enverrons un code de vérification.
        </p>
      </div>

      <form class="mt-6 space-y-4" [formGroup]="emailForm" (ngSubmit)="onDemanderCode()">
        <input formControlName="email" type="email" required
               placeholder="Adresse Email"
               class="appearance-none rounded-lg block w-full px-3 py-3 border border-gray-300
                      placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-blue-500
                      focus:border-blue-500 sm:text-sm">

        <button type="submit" [disabled]="emailForm.invalid || chargement"
                class="w-full py-3 px-4 text-sm font-bold rounded-lg text-white bg-blue-700
                       hover:bg-blue-800 transition-all disabled:opacity-50 cursor-pointer">
          <span *ngIf="!chargement">Envoyer le code</span>
          <span *ngIf="chargement"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Envoi en cours...</span>
        </button>
      </form>
    </ng-container>

    <!-- ============ ÉTAPE 2 : CODE OTP ============ -->
    <ng-container *ngIf="etape === 'code'">
      <div class="text-center">
        <i class="fa-solid fa-envelope-open-text text-3xl text-blue-700 mb-3 block"></i>
        <h2 class="text-2xl font-extrabold text-gray-900">Vérification</h2>
        <p class="mt-2 text-sm text-gray-500">
          Un code à 6 chiffres a été envoyé à <span class="font-semibold text-gray-700">{{ emailSaisi }}</span>
        </p>
      </div>

      <form class="mt-6 space-y-4" [formGroup]="codeForm" (ngSubmit)="onValiderCode()">
        <input formControlName="code" type="text" inputmode="numeric" maxlength="6" required
               placeholder="• • • • • •"
               class="appearance-none rounded-lg block w-full px-3 py-3 border border-gray-300
                      placeholder-gray-400 text-gray-900 text-center text-xl tracking-[0.5em] font-bold
                      focus:outline-none focus:ring-blue-500 focus:border-blue-500">

        <button type="submit" [disabled]="codeForm.invalid"
                class="w-full py-3 px-4 text-sm font-bold rounded-lg text-white bg-blue-700
                       hover:bg-blue-800 transition-all disabled:opacity-50 cursor-pointer">
          Vérifier le code
        </button>

        <div class="flex items-center justify-between text-sm">
          <button type="button" (click)="retourEtapeEmail()"
                  class="text-gray-500 hover:underline cursor-pointer">
            <i class="fa-solid fa-arrow-left mr-1"></i>Changer d'email
          </button>
          <button type="button" (click)="renvoyerCode()" [disabled]="chargement"
                  class="text-blue-600 font-medium hover:underline cursor-pointer disabled:opacity-50">
            Renvoyer le code
          </button>
        </div>
      </form>
    </ng-container>

    <!-- ============ ÉTAPE 3 : NOUVEAU MOT DE PASSE ============ -->
    <ng-container *ngIf="etape === 'nouveauMotDePasse'">
      <div class="text-center">
        <i class="fa-solid fa-lock text-3xl text-blue-700 mb-3 block"></i>
        <h2 class="text-2xl font-extrabold text-gray-900">Nouveau mot de passe</h2>
        <p class="mt-2 text-sm text-gray-500">Choisissez un nouveau mot de passe sécurisé.</p>
      </div>

      <form class="mt-6 space-y-4" [formGroup]="motDePasseForm" (ngSubmit)="onReinitialiser()">
        <div class="relative">
          <input [type]="showPassword ? 'text' : 'password'" formControlName="nouveauMotDePasse" required
                 placeholder="Nouveau mot de passe"
                 class="appearance-none rounded-lg block w-full px-3 py-3 border border-gray-300
                        placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-blue-500
                        focus:border-blue-500 sm:text-sm pr-12">
          <button type="button" (click)="togglePassword()"
                  class="absolute inset-y-0 right-0 flex items-center px-3 text-gray-400 hover:text-blue-600 transition-colors">
            <i [class]="showPassword ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye'"></i>
          </button>
        </div>

        <input [type]="showPassword ? 'text' : 'password'" formControlName="confirmation" required
               placeholder="Confirmer le mot de passe"
               class="appearance-none rounded-lg block w-full px-3 py-3 border border-gray-300
                      placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-blue-500
                      focus:border-blue-500 sm:text-sm">

        <button type="submit" [disabled]="motDePasseForm.invalid || chargement"
                class="w-full py-3 px-4 text-sm font-bold rounded-lg text-white bg-blue-700
                       hover:bg-blue-800 transition-all disabled:opacity-50 cursor-pointer">
          <span *ngIf="!chargement">Réinitialiser le mot de passe</span>
          <span *ngIf="chargement"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Enregistrement...</span>
        </button>
      </form>
    </ng-container>

    <p class="text-center text-sm text-gray-600 pt-2">
      <a routerLink="/login" class="text-blue-600 font-bold hover:underline">Retour à la connexion</a>
    </p>
  </div>
</div>
