<!-- Conteneur principal sans overflow qui casse la largeur -->
<div class="min-h-screen bg-gray-50">

  <!-- ========== SIDEBAR (Fixée à gauche) ========== -->
  <aside
    class="fixed left-0 top-0 bottom-0 z-50 flex flex-col bg-white border-r border-gray-200 transition-all duration-200"
    [class.w-56]="sidebarOpen"
    [class.w-16]="!sidebarOpen">

    <!-- Brand / Logo -->
    <div class="flex items-center gap-3 px-4 py-5 border-b border-gray-200">
      <div class="w-8 h-8 rounded-lg bg-blue-700 flex items-center justify-center flex-shrink-0">
        <i class="fa-solid fa-shield-halved text-white text-xs"></i>
      </div>
      <div *ngIf="sidebarOpen" class="overflow-hidden">
        <p class="text-sm font-semibold text-gray-900 leading-tight">GRC Admin</p>
        <p class="text-xs text-gray-400">Réclamations</p>
      </div>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 flex flex-col gap-1 px-2 py-4">
      <p *ngIf="sidebarOpen"
         class="text-xs text-gray-400 uppercase tracking-widest px-2 mb-2">
        Menu
      </p>

      <a
        *ngFor="let item of navItems"
        [routerLink]="item.route"
        routerLinkActive="bg-blue-50 text-blue-700 font-medium"
        class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm text-gray-500 hover:bg-gray-100 hover:text-gray-900 transition-colors no-underline overflow-hidden whitespace-nowrap">
        <i [class]="item.icon + ' w-4 text-center flex-shrink-0'"></i>
        <span *ngIf="sidebarOpen">{{ item.label }}</span>
      </a>
    </nav>

    <!-- Footer sidebar : avatar + email + logout -->
    <div class="flex items-center gap-2 px-3 py-3 border-t border-gray-200">
      <div class="w-7 h-7 rounded-full bg-blue-100 text-blue-800 text-xs font-semibold flex items-center justify-center flex-shrink-0">
        {{ getInitiales() }}
      </div>
      <div *ngIf="sidebarOpen" class="flex-1 overflow-hidden">
        <p class="text-xs text-gray-700 font-medium truncate">{{ email }}</p>
        <p class="text-xs text-gray-400">Administrateur</p>
      </div>
      <button
        (click)="logout()"
        title="Déconnexion"
        class="w-7 h-7 flex items-center justify-center rounded-md border border-gray-200 text-gray-400 hover:bg-red-50 hover:text-red-600 hover:border-red-200 transition-colors flex-shrink-0 cursor-pointer">
        <i class="fa-solid fa-right-from-bracket text-xs"></i>
      </button>
    </div>

  </aside>

  <!-- ========== CONTENU PRINCIPAL (Ajusté dynamiquement selon la sidebar) ========== -->
  <div
    class="flex flex-col min-h-screen min-w-0 transition-all duration-200"
    [class.ml-56]="sidebarOpen"
    [class.ml-16]="!sidebarOpen">

    <!-- TOPBAR -->
    <header class="sticky top-0 z-40 flex items-center justify-between gap-4 bg-white border-b border-gray-200 px-6 py-3">

      <!-- Section Gauche : Toggle + Titre -->
      <div class="flex items-center gap-4 min-w-0">
        <button
          (click)="toggleSidebar()"
          class="w-8 h-8 flex items-center justify-center rounded-md border border-gray-200 text-gray-500 hover:bg-gray-100 transition-colors cursor-pointer flex-shrink-0">
          <i class="fa-solid fa-bars text-sm"></i>
        </button>

        <h1 class="text-base font-medium text-gray-900 truncate">
          Plateforme de Réclamations Citoyennes
        </h1>
      </div>

      <!-- Section Droite : Date + Cloche + Profile -->
      <div class="flex items-center gap-4 flex-shrink-0">
        <div class="hidden sm:flex items-center gap-2 text-xs text-gray-400">
          <i class="fa-regular fa-calendar"></i>
          <span>{{ today | date:'d MMMM yyyy' }}</span>
        </div>

        <div class="flex items-center gap-3">
          <app-notification-bell></app-notification-bell>

          <a routerLink="/admin/profil" class="flex items-center gap-2 cursor-pointer hover:opacity-80 transition-opacity">
            <div class="w-8 h-8 rounded-full bg-blue-100 text-blue-800 text-xs font-semibold flex items-center justify-center">
              {{ getInitiales() }}
            </div>
          </a>
        </div>
      </div>

    </header>

    <!-- ZONE DE CONTENU VARIABLE -->
    <main class="flex-1 p-6 min-w-0 overflow-x-auto">
      <router-outlet />
    </main>

  </div>
</div>
