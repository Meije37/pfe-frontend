<div class="mb-6">
  <h2 class="text-2xl font-extrabold text-gray-900">Mon Profil</h2>
  <p class="mt-1 text-sm text-gray-500">Gérez vos informations personnelles</p>
</div>

<div *ngIf="loading" class="bg-white rounded-2xl shadow-sm border border-gray-100 p-12 text-center">
  <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-blue-700 border-t-transparent mb-4"></div>
  <p class="text-gray-500 font-medium">Chargement...</p>
</div>

<div *ngIf="!loading && profil" class="grid grid-cols-1 lg:grid-cols-3 gap-6">

  <div class="bg-white rounded-2xl shadow-xl border-t-4 border-blue-700 p-6 flex flex-col items-center text-center h-fit">
    <div class="w-24 h-24 rounded-full bg-blue-100 text-blue-800 text-3xl font-extrabold flex items-center justify-center shadow-inner mb-4">
      {{ profil.prenom?.charAt(0) }}{{ profil.nom?.charAt(0) }}
    </div>
    <h3 class="text-xl font-bold text-gray-900">{{ profil.prenom }} {{ profil.nom }}</h3>
    <span class="mt-1.5 inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-purple-100 text-purple-700 border border-purple-200">
      <i class="fa-solid fa-shield-halved mr-1.5 text-xs"></i>
      {{ profil.role }}
    </span>
  </div>

  <div class="lg:col-span-2 bg-white rounded-2xl shadow-xl p-8">
    <form [formGroup]="form" (ngSubmit)="sauvegarder()" class="space-y-5">

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Prénom</label>
          <input formControlName="prenom" type="text" class="appearance-none rounded-lg block w-full px-3 py-3 border border-gray-300 text-gray-900 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Nom</label>
          <input formControlName="nom" type="text" class="appearance-none rounded-lg block w-full px-3 py-3 border border-gray-300 text-gray-900 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-400 mb-1">Adresse Email</label>
        <input formControlName="email" type="email" class="appearance-none rounded-lg block w-full px-3 py-3 border border-gray-200 bg-gray-50 text-gray-400 cursor-not-allowed sm:text-sm">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Téléphone</label>
        <input formControlName="telephone" type="text" class="appearance-none rounded-lg block w-full px-3 py-3 border border-gray-300 text-gray-900 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
        <p *ngIf="form.get('telephone')?.invalid && form.get('telephone')?.touched" class="text-red-500 text-xs mt-1">Numéro invalide (8 chiffres requis, commence par 2, 3 ou 4).</p>
      </div>

      <div class="pt-4 border-t border-gray-100">
        <label class="block text-sm font-medium text-gray-700 mb-1">Nouveau mot de passe <span class="text-gray-400 font-normal">(laisser vide si inchangé)</span></label>
        <input formControlName="motDePasse" type="password" class="appearance-none rounded-lg block w-full px-3 py-3 border border-gray-300 sm:text-sm" placeholder="••••••••">
      </div>

      <div class="flex justify-end">
        <button type="submit" [disabled]="form.invalid || isSubmitting" class="flex items-center gap-2 px-6 py-3 bg-blue-700 text-white text-sm font-bold rounded-lg hover:bg-blue-800 transition-all cursor-pointer disabled:opacity-50">
          Enregistrer
        </button>
      </div>

    </form>
  </div>
</div>
