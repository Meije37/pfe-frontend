<div *ngIf="totalPages > 1"
     class="flex items-center justify-between px-4 py-3 bg-white border-t border-gray-100">

  <p class="text-sm text-gray-500">
    Affichage
    <span class="font-semibold text-gray-700">{{ startItem }}–{{ endItem }}</span>
    sur
    <span class="font-semibold text-gray-700">{{ totalItems }}</span>
    résultats
  </p>

  <div class="flex items-center gap-1">

    <button (click)="goToPage(currentPage - 1)"
            [disabled]="currentPage === 1"
            class="w-8 h-8 flex items-center justify-center rounded-lg text-sm border border-gray-200
                   text-gray-500 hover:bg-gray-100 transition-colors cursor-pointer
                   disabled:opacity-40 disabled:cursor-not-allowed">
      <i class="fa-solid fa-chevron-left text-xs"></i>
    </button>

    <ng-container *ngFor="let p of pages">
      <span *ngIf="p === -1"
            class="w-8 h-8 flex items-center justify-center text-sm text-gray-400">
        ...
      </span>
      <button *ngIf="p !== -1"
              (click)="goToPage(p)"
              [class]="p === currentPage
                ? 'w-8 h-8 flex items-center justify-center rounded-lg text-sm font-bold bg-blue-700 text-white border border-blue-700 cursor-pointer'
                : 'w-8 h-8 flex items-center justify-center rounded-lg text-sm border border-gray-200 text-gray-600 hover:bg-gray-100 transition-colors cursor-pointer'">
        {{ p }}
      </button>
    </ng-container>

    <button (click)="goToPage(currentPage + 1)"
            [disabled]="currentPage === totalPages"
            class="w-8 h-8 flex items-center justify-center rounded-lg text-sm border border-gray-200
                   text-gray-500 hover:bg-gray-100 transition-colors cursor-pointer
                   disabled:opacity-40 disabled:cursor-not-allowed">
      <i class="fa-solid fa-chevron-right text-xs"></i>
    </button>

  </div>
</div>
