<!-- Aperçu (mini-carte statique, non interactive) -->
<div class="relative rounded-xl overflow-hidden border border-gray-200 cursor-pointer group"
     [style.height.px]="height"
     (click)="ouvrirPleinEcran()">

  <div #previewMap class="w-full h-full"></div>

  <div class="absolute bottom-2 right-2 flex items-center gap-1 px-2 py-1 rounded-full
              bg-black/55 text-white text-[11px] group-hover:bg-black/70 transition-colors">
    <i class="fa-solid fa-expand text-[10px]"></i>
    Agrandir
  </div>
</div>

<!-- Overlay plein écran -->
<div *ngIf="isFullscreenOpen"
     class="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4"
     style="position:fixed; top:0; left:0; width:100vw; height:100vh; z-index:9999;">
  <div class="bg-white rounded-2xl overflow-hidden w-full max-w-3xl shadow-2xl">

    <div class="flex items-center justify-between px-5 py-3 border-b border-gray-100 bg-gray-50">
      <h3 class="text-sm font-semibold text-gray-700">
        <i class="fa-solid fa-location-dot mr-2 text-red-500"></i>Localisation
      </h3>
      <div class="flex items-center gap-2">
        <button (click)="ouvrirGoogleMaps()"
                class="text-xs px-3 py-1.5 rounded-lg border border-gray-200 text-gray-600 hover:bg-gray-100 transition-colors">
          <i class="fa-solid fa-map mr-1"></i>Ouvrir dans Google Maps
        </button>
        <button (click)="fermerPleinEcran()"
                class="w-8 h-8 rounded-lg flex items-center justify-center text-gray-500 hover:bg-gray-100 transition-colors">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
    </div>

    <div #fullMap class="w-full" style="height: 420px;"></div>

    <div *ngIf="adresseLabel" class="px-5 py-3 text-sm text-gray-600 border-t border-gray-100">
      <i class="fa-solid fa-location-dot mr-1 text-red-500"></i>{{ adresseLabel }}
    </div>
  </div>
</div>
